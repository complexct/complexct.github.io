    Research Experience:
      - company: University of Arizona
        position: Graduate Research Associate
        location: "Tucson, AZ"
        start_date: 2023-08
        end_date: present
        summary: "Advised by Dr. Paul Carini"
        highlights:
          - "Investigating the ecological role of Asgard archaea in coastal sediment using physiological and genomic approaches."
          - "Screening Asgard archaea growth using qPCR and combined short- and long-read DNA sequencing."
          - "Utilizing functional genomics to analyze microbial consortia from estuarine sediment and cultivate novel microorganisms using anaerobic techniques."

      - company: University of California San Diego
        position: Staff Research Associate I/II
        location: "La Jolla, CA"
        start_date: 2021-06
        end_date: 2023-07
        summary: "Advised by Dr. Rob Knight"
        highlights:
          - "Conducted viral RNA extractions and RT-qPCR multiplex assays for UC San Diego's Return to Learn SARS-CoV-2 monitoring effort."
          - "Performed library preparations for shotgun metagenomic and metatranscriptomic sequencing using liquid handling robots."
          - "Created preliminary bioinformatic analyses using multidimensional scaling and dimensionality reduction to investigate host-microbe interactions. Tested and optimized methods to increase throughput and collaboration of wetlab and drylab pipelines."
          - "Used a culture-based approach to isolate epiphytic and endophytic bacteria and fungi to investigate host- and plant tissue specificity."

      - company: NOAA Southwest Fisheries Science Center
        position: Undergraduate Research Assistant
        location: "La Jolla, CA"
        start_date: 2019-09
        end_date: 2020-03
        summary: "Advised by Dr. Andrew Thompson"
        highlights:
          - "Conducted genomic DNA tissue extraction, PCR, and Sanger sequencing to determine larval abundance of rockfish in Marine Protected Areas and environments shaped by the California Current System."

      - company: Scripps Institution of Oceanography
        position: Undergraduate Research Assistant
        location: "La Jolla, CA"
        start_date: 2019-03
        end_date: 2019-10
        summary: "Advised by Dr. William Gerwick"
        highlights:
          - "Populated database with analytical data for marine toxins (1H & 13C NMR spectroscopy and mass spectrometry) to contribute to GNPS (Global Natural Products Social Molecular Networking) and to test SMART 2.0 (Small Molecule Accurate Recognition Technology), tools for determining the nature of a chemical compound."

